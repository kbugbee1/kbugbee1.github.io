<article class="essay-card{% if include.featured %} essay-card-featured{% endif %}">
  {% if include.featured %}<p class="section-label">Featured essay</p>{% endif %}
  <time class="date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %-d, %Y' }}</time>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | normalize_whitespace | truncatewords: 40 | escape }}</p>
  <a class="text-link" href="{{ include.post.url | relative_url }}" aria-label="Read essay: {{ include.post.title | escape }}">Read essay <span aria-hidden="true">↗</span></a>
</article>
